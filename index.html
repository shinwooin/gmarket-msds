<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gmarket MSDS</title>

<style>

body {
    margin: 0;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    background: white;
    padding: 35px 20px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin-top: 10px;
    color: #666;
}

.container {
    max-width: 800px;
    margin: 30px auto;
    padding: 0 20px;
}

.search-box {
    width: 100%;
    box-sizing: border-box;
    padding: 17px;
    font-size: 17px;
    border: 1px solid #ccc;
    border-radius: 10px;
    margin-bottom: 25px;
}

.result-count {
    margin-bottom: 15px;
    color: #666;
}

.msds-item {
    background: white;
    padding: 22px;
    margin-bottom: 12px;
    border-radius: 12px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.06);
}

.msds-item h3 {
    margin: 0 0 8px 0;
}

.company {
    color: #777;
    margin-bottom: 15px;
}

.open-btn {
    display: inline-block;
    background: #00c73c;
    color: white;
    padding: 11px 18px;
    border-radius: 7px;
    text-decoration: none;
    font-weight: bold;
}

.no-result {
    display: none;
    text-align: center;
    padding: 40px;
    color: #777;
}

</style>
</head>

<body>

<header>
    <h1>Gmarket MSDS</h1>
    <p>물질안전보건자료(MSDS)를 검색하고 열람할 수 있습니다.</p>
</header>

<div class="container">

<input
    type="text"
    id="searchInput"
    class="search-box"
    placeholder="제품명 또는 제조사를 검색하세요"
>

<div class="result-count" id="resultCount"></div>


<!-- 제품 1 -->

<div class="msds-item"
     data-search="루트라이트 헨켈 순간접착제">

    <h3>루트라이트 헨켈 순간접착제</h3>

    <div class="company">
        헨켈
    </div>

    <a
        class="open-btn"
        href="msds/[취급주의][루트라이트]헨켈순간 접착제 40120g.pdf"
        target="_blank">
        MSDS 열람
    </a>

</div>


<!-- 제품 2 -->

<div class="msds-item"
     data-search="고무보호제 러버핏">

    <h3>고무보호제 스틱 러버핏 75ml</h3>

    <div class="company">
        고무보호제
    </div>

    <a
        class="open-btn"
        href="msds/고무보호제 스틱 러버핏 75ml.PDF"
        target="_blank">
        MSDS 열람
    </a>

</div>


<div class="no-result" id="noResult">
    검색 결과가 없습니다.
</div>

</div>


<script>

const searchInput = document.getElementById("searchInput");
const items = document.querySelectorAll(".msds-item");
const resultCount = document.getElementById("resultCount");
const noResult = document.getElementById("noResult");

function searchMSDS() {

    const keyword = searchInput.value
        .toLowerCase()
        .trim();

    let count = 0;

    items.forEach(item => {

        const searchText =
            item.dataset.search.toLowerCase();

        if(searchText.includes(keyword)) {

            item.style.display = "block";
            count++;

        } else {

            item.style.display = "none";

        }

    });

    resultCount.textContent =
        "검색결과 " + count + "건";

    if(count === 0) {

        noResult.style.display = "block";

    } else {

        noResult.style.display = "none";

    }

}

searchInput.addEventListener(
    "input",
    searchMSDS
);

searchMSDS();

</script>

</body>
</html>
