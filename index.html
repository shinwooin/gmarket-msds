<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmarket MSDS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: white;
      padding: 30px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    h1 {
      margin-bottom: 8px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .search {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .item {
      background: white;
      padding: 20px;
      margin-bottom: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .item h3 {
      margin-top: 0;
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<header>
  <h1>Gmarket MSDS</h1>
  <p>물질안전보건자료(MSDS)를 검색하고 열람할 수 있습니다.</p>
</header>

<div class="container">

  <input
    type="text"
    id="search"
    class="search"
    placeholder="제품명을 검색하세요"
    onkeyup="searchMSDS()"
  >

  <div class="item">
    <h3>WD-40</h3>
    <p>윤활방청제</p>
    <a class="btn" href="msds/wd40.pdf" target="_blank">
      MSDS 열람
    </a>
  </div>

  <div class="item">
    <h3>세정제 A</h3>
    <p>세정제</p>
    <a class="btn" href="msds/cleaner-a.pdf" target="_blank">
      MSDS 열람
    </a>
  </div>

</div>

<script>
function searchMSDS() {
  const input = document.getElementById("search").value.toLowerCase();
  const items = document.getElementsByClassName("item");

  for (let i = 0; i < items.length; i++) {
    const text = items[i].innerText.toLowerCase();

    if (text.includes(input)) {
      items[i].style.display = "";
    } else {
      items[i].style.display = "none";
    }
  }
}
</script>

</body>
</html>
